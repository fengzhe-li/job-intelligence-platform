<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="1080" height="560" fill="#ffffff"/>
  <text x="540" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2328">Layered Cross-Source Deduplication</text>
  <text x="540" y="56" text-anchor="middle" font-size="13" fill="#6b7280">jobintel.dedup.v1 — the same vacancy often appears on an employer's ATS and on aggregators; checks run in order</text>

  <rect x="400" y="74" width="280" height="36" rx="8" fill="#eef4ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="540" y="97" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">Incoming job vs. each canonical job</text>

  <g font-size="12.5">
    <rect x="330" y="130" width="420" height="44" rx="8" fill="#fff" stroke="#6b7280"/>
    <text x="540" y="149" text-anchor="middle" font-weight="700" fill="#1f2328">1. Same (source_name, source_job_id)?</text>
    <text x="540" y="166" text-anchor="middle" font-size="11" fill="#6b7280">exact re-fetch of a known posting</text>

    <rect x="330" y="190" width="420" height="44" rx="8" fill="#fff" stroke="#6b7280"/>
    <text x="540" y="209" text-anchor="middle" font-weight="700" fill="#1f2328">2. Same canonical application URL?</text>
    <text x="540" y="226" text-anchor="middle" font-size="11" fill="#6b7280">normalised: query / fragment / trailing slash stripped</text>

    <rect x="330" y="250" width="420" height="44" rx="8" fill="#fffbeb" stroke="#d97706"/>
    <text x="540" y="269" text-anchor="middle" font-weight="700" fill="#92400e">Guard: same source, different ids?</text>
    <text x="540" y="286" text-anchor="middle" font-size="11" fill="#92400e">two real postings (e.g. two teams, same title) — never merged by heuristics</text>

    <rect x="330" y="310" width="420" height="44" rx="8" fill="#fff" stroke="#6b7280"/>
    <text x="540" y="329" text-anchor="middle" font-weight="700" fill="#1f2328">3. Same company + title + location?</text>
    <text x="540" y="346" text-anchor="middle" font-size="11" fill="#6b7280">normalised strings; seniority markers must also agree</text>

    <rect x="330" y="370" width="420" height="44" rx="8" fill="#fff" stroke="#6b7280"/>
    <text x="540" y="389" text-anchor="middle" font-weight="700" fill="#1f2328">4. Fuzzy title, same company?</text>
    <text x="540" y="406" text-anchor="middle" font-size="11" fill="#6b7280">SequenceMatcher ≥ 0.88, shared location, same seniority markers</text>
  </g>
  <g stroke="#6b7280" stroke-width="1.6">
    <line x1="540" y1="110" x2="540" y2="126" marker-end="url(#arrow)"/>
    <line x1="540" y1="174" x2="540" y2="186" marker-end="url(#arrow)"/>
    <line x1="540" y1="234" x2="540" y2="246" marker-end="url(#arrow)"/>
    <line x1="540" y1="294" x2="540" y2="306" marker-end="url(#arrow)"/>
    <line x1="540" y1="354" x2="540" y2="366" marker-end="url(#arrow)"/>
    <line x1="540" y1="414" x2="540" y2="438" marker-end="url(#arrow)"/>
  </g>

  <!-- yes branches -->
  <rect x="820" y="200" width="236" height="120" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="938" y="228" text-anchor="middle" font-size="14" font-weight="700" fill="#047857">Match → merge</text>
  <g font-size="11.5" fill="#065f46">
    <text x="938" y="250" text-anchor="middle">observations combined</text>
    <text x="938" y="268" text-anchor="middle">(earliest first_seen, latest last_seen)</text>
    <text x="938" y="286" text-anchor="middle">direct-ATS record preferred</text>
    <text x="938" y="304" text-anchor="middle">for title / JD / salary</text>
  </g>
  <g stroke="#10b981" stroke-width="1.4" fill="none">
    <path d="M750 152 H790 V260 H816" marker-end="url(#arrow)"/>
    <path d="M750 212 H790"/>
    <path d="M750 332 H790 V260"/>
    <path d="M750 392 H790 V332"/>
  </g>
  <text x="770" y="146" font-size="11" fill="#047857">yes</text>

  <!-- guard branch -->
  <rect x="24" y="250" width="250" height="44" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="149" y="269" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b91c1c">Keep separate</text>
  <text x="149" y="286" text-anchor="middle" font-size="11" fill="#991b1b">skip this candidate</text>
  <line x1="330" y1="272" x2="278" y2="272" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="300" y="266" font-size="11" fill="#b91c1c">yes</text>

  <rect x="400" y="440" width="280" height="36" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="540" y="463" text-anchor="middle" font-size="12.5" font-weight="700" fill="#374151">No match → new canonical job</text>

  <text x="540" y="508" text-anchor="middle" font-size="12" fill="#4b5563">Direct sources (company, Greenhouse, Lever, Ashby, Workable, SmartRecruiters, Workday) take precedence over Adzuna / Prospects / manual</text>
  <text x="540" y="528" text-anchor="middle" font-size="12" fill="#4b5563">observations for display fields. repair-historical-dedup re-applies these rules to stores merged under older rules (with a backup first).</text>
</svg>
