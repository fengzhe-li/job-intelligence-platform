<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="1200" height="560" fill="#ffffff"/>
  <text x="600" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1f2328">Daily Refresh &amp; Data Flow</text>
  <text x="600" y="56" text-anchor="middle" font-size="13" fill="#6b7280">jobintel.pipeline.daily — each step is isolated: one failing source never blocks the others</text>

  <!-- Step boxes -->
  <g font-size="12">
    <rect x="24" y="84" width="270" height="150" rx="10" fill="#eef4ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="40" y="108" font-size="14" font-weight="700" fill="#1d4ed8">1 · Registry direct-ATS</text>
    <text x="40" y="132" fill="#1e3a8a">Greenhouse, Lever, Ashby, Workable,</text>
    <text x="40" y="150" fill="#1e3a8a">SmartRecruiters, Workday — plus WTTJ</text>
    <text x="40" y="168" fill="#1e3a8a">only when WTTJ_API_KEY is set</text>
    <text x="40" y="196" fill="#047857" font-weight="700">Can prove a complete scope</text>
    <text x="40" y="214" fill="#047857">→ eligible for closure inference</text>

    <rect x="318" y="84" width="270" height="150" rx="10" fill="#eef4ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="334" y="108" font-size="14" font-weight="700" fill="#1d4ed8">2 · Discovery sources</text>
    <text x="334" y="132" fill="#1e3a8a">Adzuna (needs ADZUNA_APP_ID/KEY;</text>
    <text x="334" y="150" fill="#1e3a8a">otherwise recorded "not_configured")</text>
    <text x="334" y="168" fill="#1e3a8a">Prospects (2 IT/engineering categories)</text>
    <text x="334" y="196" fill="#b45309" font-weight="700">Never a complete scope</text>
    <text x="334" y="214" fill="#b45309">→ can never close a job</text>

    <rect x="612" y="84" width="270" height="150" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="628" y="108" font-size="14" font-weight="700" fill="#6d28d9">3 · Company discovery</text>
    <text x="628" y="132" fill="#4c1d95">Employers seen in ingested jobs but</text>
    <text x="628" y="150" fill="#4c1d95">absent from the registry are logged</text>
    <text x="628" y="168" fill="#4c1d95">with provenance + ATS hint.</text>
    <text x="628" y="196" fill="#4c1d95">Promotion into the registry is a</text>
    <text x="628" y="214" fill="#4c1d95">separate, human-reviewed step.</text>

    <rect x="906" y="84" width="270" height="150" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="922" y="108" font-size="14" font-weight="700" fill="#6d28d9">4 · GitHub sync (optional)</text>
    <text x="922" y="132" fill="#4c1d95">Runs last, only if</text>
    <text x="922" y="150" fill="#4c1d95">JOBINTEL_GITHUB_USERNAME is set.</text>
    <text x="922" y="168" fill="#4c1d95">Incremental repository refresh</text>
    <text x="922" y="186" fill="#4c1d95">for the Evidence Bank. GitHub</text>
    <text x="922" y="204" fill="#4c1d95">outages cannot block job discovery.</text>
  </g>
  <line x1="294" y1="159" x2="314" y2="159" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="588" y1="159" x2="608" y2="159" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="882" y1="159" x2="902" y2="159" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- per-connector refresh detail -->
  <rect x="24" y="262" width="858" height="190" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="40" y="288" font-size="14" font-weight="700" fill="#047857">Per connector: refresh_connector()</text>
  <g font-size="12" fill="#065f46">
    <rect x="40" y="302" width="150" height="56" rx="6" fill="#fff" stroke="#10b981"/>
    <text x="115" y="325" text-anchor="middle" font-weight="700">SourceSnapshot</text>
    <text x="115" y="343" text-anchor="middle" font-size="11">payloads + scopes</text>
    <rect x="210" y="302" width="150" height="56" rx="6" fill="#fff" stroke="#10b981"/>
    <text x="285" y="325" text-anchor="middle" font-weight="700">Normalise + enrich</text>
    <text x="285" y="343" text-anchor="middle" font-size="11">canonical Job</text>
    <rect x="380" y="302" width="150" height="56" rx="6" fill="#fff" stroke="#10b981"/>
    <text x="455" y="325" text-anchor="middle" font-weight="700">Deduplicate</text>
    <text x="455" y="343" text-anchor="middle" font-size="11">merge observations</text>
    <rect x="550" y="302" width="150" height="56" rx="6" fill="#fff" stroke="#10b981"/>
    <text x="625" y="325" text-anchor="middle" font-weight="700">write_snapshot</text>
    <text x="625" y="343" text-anchor="middle" font-size="11">NEW / CHANGED / …</text>
    <rect x="720" y="302" width="148" height="56" rx="6" fill="#fff" stroke="#10b981"/>
    <text x="794" y="325" text-anchor="middle" font-weight="700">Source health</text>
    <text x="794" y="343" text-anchor="middle" font-size="11">distinct states</text>
  </g>
  <line x1="190" y1="330" x2="206" y2="330" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="360" y1="330" x2="376" y2="330" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="530" y1="330" x2="546" y2="330" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="700" y1="330" x2="716" y2="330" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
  <g font-size="11.5" fill="#065f46">
    <text x="40" y="386">• A job is marked DISAPPEARED only if it is absent <tspan font-weight="700">and</tspan> its scope was observed completely (no page cap, no limit cut, no filter).</text>
    <text x="40" y="406">• A suspicious collapse (0 results, or &lt;20% of the last healthy count) withholds closure for that cycle.</text>
    <text x="40" y="426">• A failed or partial refresh keeps the last successful sync time; "failed", "0 results" and "not configured" never blur together.</text>
    <text x="40" y="446">• Deadlines are kept per source observation; conflicting deadlines stay visible, never silently resolved.</text>
  </g>

  <!-- output -->
  <rect x="906" y="262" width="270" height="190" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="922" y="288" font-size="14" font-weight="700" fill="#c2410c">DailyRefreshReport</text>
  <g font-size="12" fill="#9a3412">
    <text x="922" y="314">Per source: succeeded /</text>
    <text x="922" y="332">succeeded_zero_results / partial /</text>
    <text x="922" y="350">failed / not_configured</text>
    <text x="922" y="378">Manual-only sources are listed,</text>
    <text x="922" y="396">never reported as "attempted"</text>
    <text x="922" y="424">Persisted (latest + history) and</text>
    <text x="922" y="442">rendered by the Today page</text>
  </g>

  <rect x="24" y="476" width="1152" height="62" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="600" y="500" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">Manual sources stay manual</text>
  <text x="600" y="522" text-anchor="middle" font-size="12" fill="#4b5563">Trackr, Gradcracker and Bright Network enter via graduate-source-import / manual-job-import and the watchlist, through the same normalise → enrich → dedup path</text>
</svg>
