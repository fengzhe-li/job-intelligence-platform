<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="1080" height="560" fill="#ffffff"/>
  <text x="540" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2328">System Architecture</text>
  <text x="540" y="56" text-anchor="middle" font-size="13" fill="#6b7280">Multi-source job aggregation, deduplication, explainable ranking, and dual-interface serving</text>

  <!-- Connectors column -->
  <rect x="30" y="90" width="230" height="330" rx="10" fill="#eef4ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="145" y="116" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1d4ed8">Source Connectors</text>
  <g font-size="12" fill="#1d4ed8">
    <rect x="48" y="130" width="194" height="26" rx="5" fill="#ffffff" stroke="#3b82f6"/><text x="145" y="147" text-anchor="middle">Greenhouse</text>
    <rect x="48" y="162" width="194" height="26" rx="5" fill="#ffffff" stroke="#3b82f6"/><text x="145" y="179" text-anchor="middle">Lever</text>
    <rect x="48" y="194" width="194" height="26" rx="5" fill="#ffffff" stroke="#3b82f6"/><text x="145" y="211" text-anchor="middle">Ashby</text>
    <rect x="48" y="226" width="194" height="26" rx="5" fill="#ffffff" stroke="#3b82f6"/><text x="145" y="243" text-anchor="middle">Workable</text>
    <rect x="48" y="258" width="194" height="26" rx="5" fill="#ffffff" stroke="#3b82f6"/><text x="145" y="275" text-anchor="middle">SmartRecruiters</text>
    <rect x="48" y="290" width="194" height="26" rx="5" fill="#ffffff" stroke="#3b82f6"/><text x="145" y="307" text-anchor="middle">Adzuna (official API)</text>
    <rect x="48" y="322" width="194" height="26" rx="5" fill="#ffffff" stroke="#3b82f6"/><text x="145" y="339" text-anchor="middle">Welcome to the Jungle</text>
  </g>
  <text x="145" y="368" text-anchor="middle" font-size="11" fill="#1d4ed8">Common interface: JobSourceConnector</text>
  <text x="145" y="384" text-anchor="middle" font-size="11" fill="#1d4ed8">fetch_jobs / health_check / normalise</text>
  <rect x="48" y="396" width="194" height="14" fill="none"/>

  <text x="145" y="440" text-anchor="middle" font-size="11.5" fill="#6b7280">Company registry</text>
  <text x="145" y="456" text-anchor="middle" font-size="11.5" fill="#6b7280">(config/target_companies.json)</text>
  <text x="145" y="472" text-anchor="middle" font-size="11.5" fill="#6b7280">drives which connectors run,</text>
  <text x="145" y="488" text-anchor="middle" font-size="11.5" fill="#6b7280">with automated ATS discovery</text>
  <text x="145" y="504" text-anchor="middle" font-size="11.5" fill="#6b7280">and HTTP verification</text>

  <!-- Pipeline column -->
  <rect x="300" y="90" width="230" height="330" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="415" y="116" text-anchor="middle" font-size="14.5" font-weight="700" fill="#047857">Pipeline</text>
  <g font-size="12" fill="#047857">
    <rect x="318" y="132" width="194" height="40" rx="6" fill="#ffffff" stroke="#10b981"/>
    <text x="415" y="148" text-anchor="middle">Normalise to canonical</text>
    <text x="415" y="163" text-anchor="middle">Job model</text>

    <rect x="318" y="182" width="194" height="52" rx="6" fill="#ffffff" stroke="#10b981"/>
    <text x="415" y="200" text-anchor="middle">Layered deduplication</text>
    <text x="415" y="216" text-anchor="middle" font-size="10.5">ID / URL / company+title+</text>
    <text x="415" y="230" text-anchor="middle" font-size="10.5">location / fuzzy title match</text>

    <rect x="318" y="244" width="194" height="52" rx="6" fill="#ffffff" stroke="#10b981"/>
    <text x="415" y="262" text-anchor="middle">Deterministic enrichment</text>
    <text x="415" y="278" text-anchor="middle" font-size="10.5">sponsorship, grad-year,</text>
    <text x="415" y="292" text-anchor="middle" font-size="10.5">role-track, seniority</text>

    <rect x="318" y="306" width="194" height="52" rx="6" fill="#ffffff" stroke="#10b981"/>
    <text x="415" y="324" text-anchor="middle">Explainable matching</text>
    <text x="415" y="340" text-anchor="middle" font-size="10.5">component-scored against</text>
    <text x="415" y="354" text-anchor="middle" font-size="10.5">candidate evidence</text>
  </g>

  <!-- Storage column -->
  <rect x="570" y="90" width="220" height="200" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="680" y="116" text-anchor="middle" font-size="14.5" font-weight="700" fill="#b45309">Storage</text>
  <g font-size="11.5" fill="#b45309">
    <rect x="588" y="130" width="184" height="46" rx="6" fill="#ffffff" stroke="#f59e0b"/>
    <text x="680" y="148" text-anchor="middle">Raw JSONL snapshots</text>
    <text x="680" y="164" text-anchor="middle" font-size="10">data/local/raw_snapshots/</text>

    <rect x="588" y="184" width="184" height="46" rx="6" fill="#ffffff" stroke="#f59e0b"/>
    <text x="680" y="202" text-anchor="middle">Canonical jobs JSON</text>
    <text x="680" y="218" text-anchor="middle" font-size="10">data/local/processed/</text>

    <rect x="588" y="238" width="184" height="40" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-dasharray="5,3"/>
    <text x="680" y="256" text-anchor="middle">PostgreSQL-ready schema</text>
    <text x="680" y="270" text-anchor="middle" font-size="10">data_contracts/ (not wired up)</text>
  </g>

  <!-- Serving column -->
  <rect x="830" y="90" width="220" height="200" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="940" y="116" text-anchor="middle" font-size="14.5" font-weight="700" fill="#374151">Serving</text>
  <g font-size="11.5" fill="#374151">
    <rect x="848" y="130" width="184" height="52" rx="6" fill="#ffffff" stroke="#9ca3af"/>
    <text x="940" y="148" text-anchor="middle">CLI (20 subcommands)</text>
    <text x="940" y="164" text-anchor="middle" font-size="10">ingest, rank, profile, ATS ops</text>

    <rect x="848" y="192" width="184" height="52" rx="6" fill="#ffffff" stroke="#9ca3af"/>
    <text x="940" y="210" text-anchor="middle">Bilingual EN/ZH dashboard</text>
    <text x="940" y="226" text-anchor="middle" font-size="10">stdlib http.server, no framework</text>
  </g>

  <!-- Arrows -->
  <path d="M260,255 L295,255" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M530,255 L565,255" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M790,190 L825,190" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="30" y="450" width="1020" height="86" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="50" y="474" font-size="13" font-weight="700" fill="#1f2328">Zero third-party runtime dependencies</text>
  <text x="50" y="494" font-size="12" fill="#4b5563">Connectors, dedup, matching, and the dashboard are built entirely on the Python standard library</text>
  <text x="50" y="512" font-size="12" fill="#4b5563">(urllib, http.server, csv, json, xml.etree, difflib). pytest is a dev-only dependency for the test suite.</text>

  <text x="540" y="552" text-anchor="middle" font-size="11" fill="#9ca3af">143 tests pass locally; not deployed to any live service.</text>
</svg>
