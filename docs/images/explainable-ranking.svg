<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 480" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="1040" height="480" fill="#ffffff"/>
  <text x="520" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2328">Explainable Candidate/Job Matching</text>
  <text x="520" y="56" text-anchor="middle" font-size="13" fill="#6b7280">Every ranked job carries per-component scores and cited evidence, not just a single opaque number</text>

  <!-- inputs -->
  <rect x="40" y="90" width="230" height="110" rx="10" fill="#eef4ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="155" y="114" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1d4ed8">Candidate profile</text>
  <text x="155" y="136" text-anchor="middle" font-size="11" fill="#1d4ed8">Capabilities with cited evidence</text>
  <text x="155" y="152" text-anchor="middle" font-size="11" fill="#1d4ed8">(quote + source + confidence),</text>
  <text x="155" y="168" text-anchor="middle" font-size="11" fill="#1d4ed8">extracted from CV / project /</text>
  <text x="155" y="184" text-anchor="middle" font-size="11" fill="#1d4ed8">README / education text</text>

  <rect x="40" y="220" width="230" height="90" rx="10" fill="#eef4ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="155" y="244" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1d4ed8">Canonical job</text>
  <text x="155" y="266" text-anchor="middle" font-size="11" fill="#1d4ed8">Normalised title, description,</text>
  <text x="155" y="282" text-anchor="middle" font-size="11" fill="#1d4ed8">location, enrichment flags</text>

  <path d="M270,145 L330,220" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrow3)"/>
  <path d="M270,265 L330,240" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrow3)"/>

  <!-- matcher -->
  <rect x="335" y="160" width="220" height="140" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="445" y="186" text-anchor="middle" font-size="13.5" font-weight="700" fill="#047857">match_job()</text>
  <text x="445" y="208" text-anchor="middle" font-size="11" fill="#047857">Scores 11 independent</text>
  <text x="445" y="224" text-anchor="middle" font-size="11" fill="#047857">components: technical fit, role</text>
  <text x="445" y="240" text-anchor="middle" font-size="11" fill="#047857">preference, seniority, sponsorship,</text>
  <text x="445" y="256" text-anchor="middle" font-size="11" fill="#047857">grad-year, location, source quality,</text>
  <text x="445" y="272" text-anchor="middle" font-size="11" fill="#047857">freshness, and more</text>

  <path d="M555,230 L590,230" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrow3)"/>

  <!-- output -->
  <rect x="595" y="90" width="405" height="330" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="797" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">MatchResult (per job)</text>

  <g font-size="11.5" fill="#92400e">
    <rect x="615" y="130" width="365" height="34" rx="6" fill="#ffffff" stroke="#f59e0b"/>
    <text x="797" y="152" text-anchor="middle">overall_priority — weighted sum, config-driven weights</text>

    <rect x="615" y="170" width="365" height="34" rx="6" fill="#ffffff" stroke="#f59e0b"/>
    <text x="797" y="192" text-anchor="middle">components[] — named score + explanation, each</text>

    <rect x="615" y="210" width="365" height="46" rx="6" fill="#ffffff" stroke="#f59e0b"/>
    <text x="797" y="228" text-anchor="middle">strongest_supporting_evidence — quoted capability</text>
    <text x="797" y="242" text-anchor="middle">evidence that matched this job</text>

    <rect x="615" y="262" width="365" height="34" rx="6" fill="#ffffff" stroke="#f59e0b"/>
    <text x="797" y="284" text-anchor="middle">missing_or_weak_evidence — honest gaps</text>

    <rect x="615" y="302" width="365" height="34" rx="6" fill="#ffffff" stroke="#f59e0b"/>
    <text x="797" y="324" text-anchor="middle">best_existing_cv_category / hybrid_cv_recommended</text>

    <rect x="615" y="342" width="365" height="34" rx="6" fill="#ffffff" stroke="#f59e0b"/>
    <text x="797" y="364" text-anchor="middle">explanation — human-readable sentence combining all of the above</text>
  </g>

  <text x="797" y="400" text-anchor="middle" font-size="11.5" fill="#6b7280">Rendered in the dashboard job-detail view as separate,</text>
  <text x="797" y="416" text-anchor="middle" font-size="11.5" fill="#6b7280">independently inspectable sections — not a single black-box score.</text>

  <rect x="40" y="330" width="530" height="60" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="60" y="354" font-size="12" fill="#374151" font-weight="600">Special case: excluded occupations short-circuit</text>
  <text x="60" y="372" font-size="11.5" fill="#4b5563">(e.g. sales, marketing) get a single "excluded_occupation" component at -100</text>
  <text x="60" y="386" font-size="11.5" fill="#4b5563">and are kept — not deleted — sorted to the bottom of the list.</text>
</svg>
