<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1214" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="1000" height="1214" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1f2328">Supervised application workflow</text>
  <text x="500" y="56" text-anchor="middle" font-size="13" fill="#6b7280">From job discovery to a filled form handed back to the human; the final Submit is always manual</text>
  <rect x="290" y="84" width="420" height="54" rx="9" fill="#eef4ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="500.0" y="107" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1d4ed8">Job sources</text>
  <text x="500.0" y="126" text-anchor="middle" font-size="11.5" fill="#1d4ed8">employer ATS boards · graduate boards · aggregators · manual import</text>
  <rect x="290" y="164" width="420" height="54" rx="9" fill="#eef4ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="500.0" y="187" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1d4ed8">Discovery · normalisation · deduplication</text>
  <text x="500.0" y="206" text-anchor="middle" font-size="11.5" fill="#1d4ed8">snapshots, history and closure only from fully observed listings</text>
  <line x1="500.0" y1="140" x2="500.0" y2="162" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="290" y="244" width="420" height="54" rx="9" fill="#eef4ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="500.0" y="267" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1d4ed8">Eligibility + relevance</text>
  <text x="500.0" y="286" text-anchor="middle" font-size="11.5" fill="#1d4ed8">hard requirements, sponsorship policy, explainable ranking</text>
  <line x1="500.0" y1="220" x2="500.0" y2="242" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="290" y="324" width="420" height="54" rx="9" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="500.0" y="347" text-anchor="middle" font-size="14.5" font-weight="700" fill="#047857">Authoritative candidate evidence</text>
  <text x="500.0" y="366" text-anchor="middle" font-size="11.5" fill="#047857">Evidence Bank · experience master · Answer Bank</text>
  <line x1="716" y1="351.0" x2="736" y2="351.0" stroke="#10b981" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="742" y="347.0" font-size="11.5" fill="#047857">personal data: git-ignored</text>
  <text x="742" y="363.0" font-size="11.5" fill="#047857">local store, never published</text>
  <line x1="500.0" y1="300" x2="500.0" y2="322" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="290" y="404" width="420" height="54" rx="9" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="500.0" y="427" text-anchor="middle" font-size="14.5" font-weight="700" fill="#047857">JD-aware CV + answer resolution</text>
  <text x="500.0" y="446" text-anchor="middle" font-size="11.5" fill="#047857">selected, cited evidence · deterministic answers only</text>
  <line x1="716" y1="431.0" x2="736" y2="431.0" stroke="#10b981" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="742" y="427.0" font-size="11.5" fill="#047857">claims validated against</text>
  <text x="742" y="443.0" font-size="11.5" fill="#047857">cited evidence; human review</text>
  <line x1="500.0" y1="380" x2="500.0" y2="402" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="290" y="484" width="420" height="54" rx="9" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="500.0" y="507" text-anchor="middle" font-size="14.5" font-weight="700" fill="#5b21b6">Sealed application package</text>
  <text x="500.0" y="526" text-anchor="middle" font-size="11.5" fill="#5b21b6">exact CV (SHA-256) · answers · URL · package hash</text>
  <line x1="716" y1="511.0" x2="736" y2="511.0" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="742" y="507.0" font-size="11.5" fill="#5b21b6">any change → new hash →</text>
  <text x="742" y="523.0" font-size="11.5" fill="#5b21b6">old approval invalid</text>
  <line x1="500.0" y1="460" x2="500.0" y2="482" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="290" y="564" width="420" height="54" rx="9" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="500.0" y="587" text-anchor="middle" font-size="14.5" font-weight="700" fill="#c2410c">Human approval</text>
  <text x="500.0" y="606" text-anchor="middle" font-size="11.5" fill="#c2410c">named reviewer · acknowledged gate reasons · expiry</text>
  <line x1="500.0" y1="540" x2="500.0" y2="562" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="290" y="644" width="420" height="54" rx="9" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="500.0" y="667" text-anchor="middle" font-size="14.5" font-weight="700" fill="#5b21b6">Browser executor</text>
  <text x="500.0" y="686" text-anchor="middle" font-size="11.5" fill="#5b21b6">one shared stop-only runner · one request · one exact host</text>
  <line x1="500.0" y1="620" x2="500.0" y2="642" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="290" y="724" width="420" height="54" rx="9" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="500.0" y="747" text-anchor="middle" font-size="14.5" font-weight="700" fill="#5b21b6">Local headed Chrome  (primary)</text>
  <text x="500.0" y="766" text-anchor="middle" font-size="11.5" fill="#5b21b6">fresh isolated profile · CDP on 127.0.0.1 only</text>
  <line x1="500.0" y1="700" x2="500.0" y2="722" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="20" y="724" width="240" height="54" rx="9" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="140.0" y="747" text-anchor="middle" font-size="14.5" font-weight="700" fill="#4b5563">Browserbase</text>
  <text x="140.0" y="766" text-anchor="middle" font-size="11.5" fill="#4b5563">same runner + rules · regression path</text>
  <path d="M290 671.0 H140.0 V722" fill="none" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <line x1="500.0" y1="780" x2="500.0" y2="802" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="290" y="804" width="420" height="54" rx="9" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="500.0" y="827" text-anchor="middle" font-size="14.5" font-weight="700" fill="#5b21b6">Deterministic filling</text>
  <text x="500.0" y="846" text-anchor="middle" font-size="11.5" fill="#5b21b6">approved values only · exact GraphQL reads / scoped autosave</text>
  <line x1="716" y1="831.0" x2="736" y2="831.0" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="742" y="827.0" font-size="11.5" fill="#5b21b6">exact host · method · operation</text>
  <text x="742" y="843.0" font-size="11.5" fill="#5b21b6">no wildcards, no auto-retry</text>
  <line x1="500.0" y1="860" x2="500.0" y2="882" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="290" y="884" width="420" height="54" rx="9" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="500.0" y="907" text-anchor="middle" font-size="14.5" font-weight="700" fill="#5b21b6">Approved CV upload</text>
  <text x="500.0" y="926" text-anchor="middle" font-size="11.5" fill="#5b21b6">sealed CV only, inside one upload window</text>
  <line x1="716" y1="911.0" x2="736" y2="911.0" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="742" y="907.0" font-size="11.5" fill="#5b21b6">handle → storage (sealed bytes)</text>
  <text x="742" y="923.0" font-size="11.5" fill="#5b21b6">→ association → visible</text>
  <line x1="500.0" y1="940" x2="500.0" y2="962" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="290" y="964" width="420" height="54" rx="9" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="500.0" y="987" text-anchor="middle" font-size="14.5" font-weight="700" fill="#c2410c">Human-only escalation</text>
  <text x="500.0" y="1006" text-anchor="middle" font-size="11.5" fill="#c2410c">unknown, sensitive, ambiguous or reserved questions</text>
  <line x1="716" y1="991.0" x2="736" y2="991.0" stroke="#f97316" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="742" y="995.0" font-size="11.5" fill="#c2410c">never generated</text>
  <line x1="500.0" y1="1020" x2="500.0" y2="1042" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="290" y="1044" width="420" height="54" rx="9" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="500.0" y="1067" text-anchor="middle" font-size="14.5" font-weight="700" fill="#c2410c">Human handoff</text>
  <text x="500.0" y="1086" text-anchor="middle" font-size="11.5" fill="#c2410c">routes removed · submit guard released · window left open</text>
  <line x1="500.0" y1="1100" x2="500.0" y2="1122" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="290" y="1124" width="420" height="54" rx="9" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="500.0" y="1147" text-anchor="middle" font-size="14.5" font-weight="700" fill="#c2410c">Manual final Submit</text>
  <text x="500.0" y="1166" text-anchor="middle" font-size="11.5" fill="#c2410c">the candidate reviews everything and submits</text>
  <line x1="716" y1="1151.0" x2="736" y2="1151.0" stroke="#f97316" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="742" y="1147.0" font-size="11.5" fill="#c2410c">never automated:</text>
  <text x="742" y="1163.0" font-size="11.5" fill="#c2410c">final_submit_clicked = false</text>
  <g font-size="11" fill="#4b5563">
    <rect x="20" y="1154" width="12" height="12" rx="2" fill="#eef4ff" stroke="#3b82f6"/><text x="38" y="1164">job intelligence</text>
    <rect x="20" y="1174" width="12" height="12" rx="2" fill="#ecfdf5" stroke="#10b981"/><text x="38" y="1184">candidate evidence</text>
    <rect x="150" y="1154" width="12" height="12" rx="2" fill="#f5f3ff" stroke="#8b5cf6"/><text x="168" y="1164">sealed / automated</text>
    <rect x="150" y="1174" width="12" height="12" rx="2" fill="#fff7ed" stroke="#f97316"/><text x="168" y="1184">human decision</text>
  </g>
</svg>
