<!doctype html><html><head><title>Job Application for Graduate Engineer at ExampleCo</title></head><body>
<!-- Synthetic Greenhouse-style hosted job-board form (offline), shaped like the audited public page: labelled
     first/last name, email, ARIA comboboxes for Country and Location (City), phone; a resume group titled by
     aria-labelledby whose own input label is only "Attach" (and a cover-letter group the same way); selecting
     the resume presigns with a GET and POSTs the file once to the board's storage host, then shows its name;
     custom questions (profile link, how did you hear, relocation, sponsorship, an acknowledgement); the final
     submit sits behind a captcha. Query: mode=ok | storage_fail (storage answers 500) | storage_twice |
     extra_post (an unknown same-host POST at load) | no_name (the file name is never shown) -->
<h1>Graduate Engineer</h1><div class="company-name">ExampleCo</div>
<form id="application-form">
  <div><label for="first_name">First Name<span class="required">*</span></label><input type="text" id="first_name" required></div>
  <div><label for="last_name">Last Name<span class="required">*</span></label><input type="text" id="last_name" required></div>
  <div><label for="email">Email<span class="required">*</span></label><input type="text" id="email" required></div>
  <div><label for="country">Country<span class="required">*</span></label>
    <div class="select__value-container"><div class="select__single-value"></div>
      <input type="text" id="country" role="combobox" aria-expanded="false" aria-required="true"></div></div>
  <div><label for="phone">Phone<span class="required">*</span></label><input type="tel" id="phone" required></div>
  <div><label for="candidate-location">Location (City)<span class="required">*</span></label>
    <div class="select__value-container"><div class="select__single-value"></div>
      <input type="text" id="candidate-location" role="combobox" aria-expanded="false" aria-required="true"></div></div>
  <div role="group" aria-labelledby="upload-label-resume" aria-required="true" class="file-upload">
    <div id="upload-label-resume" class="label upload-label">Resume/CV<span class="required">*</span></div>
    <button type="button" class="btn btn--pill">Attach</button><label class="visually-hidden" for="resume">Attach</label>
    <input id="resume" type="file" accept=".pdf,.doc,.docx"><span id="resume-filename"></span></div>
  <div role="group" aria-labelledby="upload-label-cover_letter" class="file-upload">
    <div id="upload-label-cover_letter" class="label upload-label">Cover Letter</div>
    <button type="button" class="btn btn--pill">Attach</button><label class="visually-hidden" for="cover_letter">Attach</label>
    <input id="cover_letter" type="file" accept=".pdf"></div>
  <div><label for="q_link">Would you like to include your LinkedIn profile, personal website or blog?</label><input type="text" id="q_link"></div>
  <div><label for="q_heard">How did you hear about this job?<span class="required">*</span></label><input type="text" id="q_heard" required></div>
  <div><label for="q_spons">Do you now or will you in the future require immigration sponsorship to work at ExampleCo?<span class="required">*</span></label>
    <select id="q_spons" required><option value=""></option><option>Yes</option><option>No</option></select></div>
  <div><input type="checkbox" id="q_ack" name="question_1[]" required><label for="q_ack">Acknowledge/Confirm</label></div>
  <button type="submit" id="btn-submit">Submit application</button>
</form>
<style>.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}</style>
<script>
  const q = new URLSearchParams(location.search), mode = q.get("mode") || "ok";
  fetch("https://c.spl.example-analytics.test/com.snowplowanalytics.snowplow/tp2", {method: "POST", body: "event"});
  if (mode === "extra_post") fetch("/telemetry", {method: "POST", body: "x"});
  document.getElementById("application-form").addEventListener("submit", (e) => {
    e.preventDefault(); document.body.dataset.submitted = "1"; fetch(location.pathname, {method: "POST", body: "final"});
  });
  // React-Select-like: names its listbox (aria-controls) only while open, renders it only when (async)
  // options exist, clears the typing input on pick and shows the choice (or its short form) beside it.
  function combobox(inputId, optionsFor, shownAs, delay) {
    const input = document.getElementById(inputId), single = input.parentElement.querySelector(".select__single-value");
    const listId = `react-select-${inputId}-listbox`;
    const close = () => { const l = document.getElementById(listId); if (l) l.remove();
                          input.removeAttribute("aria-controls"); input.setAttribute("aria-expanded", "false"); };
    const render = () => setTimeout(() => {
      close(); const options = optionsFor(input.value.trim()); if (!options.length) return;
      const list = document.createElement("div"); list.setAttribute("role", "listbox"); list.id = listId;
      options.forEach((text, i) => {
        const o = document.createElement("div"); o.setAttribute("role", "option"); o.id = `${listId}-option-${i}`; o.textContent = text;
        o.addEventListener("mousedown", (e) => { e.preventDefault(); single.textContent = shownAs(text); input.value = ""; close(); });
        list.appendChild(o); });
      input.parentElement.appendChild(list); input.setAttribute("aria-controls", listId); input.setAttribute("aria-expanded", "true");
    }, delay);
    input.addEventListener("click", render); input.addEventListener("input", render);
  }
  combobox("country", (v) => ["United Kingdom +44", "United States +1", "Ukraine +380"].filter((c) => !v || c.toLowerCase().startsWith(v.toLowerCase())),
           (t) => t.split(" ").pop(), 50);
  combobox("candidate-location", (v) => v ? [`${v}, England, United Kingdom`, `East ${v}, Eastern Cape, South Africa`, `${v}, Ontario, Canada`,
                                             `${v}derry / Derry, Northern Ireland, United Kingdom`] : [], (t) => t, 400);
  function upload(file) {
    fetch("/uploads/presign?name=" + encodeURIComponent(file.name)).then(() => {
      const fd = new FormData(); fd.append("key", "uploads/abc/" + file.name); fd.append("x-mode", mode); fd.append("file", file, file.name);
      const req = new XMLHttpRequest();
      req.onreadystatechange = () => {
        if (req.readyState !== 4) return;
        if (req.status >= 200 && req.status < 300 && mode !== "no_name") document.getElementById("resume-filename").textContent = file.name;
      };
      req.open("POST", "https://uploads.example-storage.test/", true); req.send(fd);
    });
  }
  document.getElementById("resume").addEventListener("change", function () {
    const f = this.files[0]; if (!f) return; upload(f);
    if (mode === "storage_twice") setTimeout(() => upload(f), 50);
  });
</script></body></html>
