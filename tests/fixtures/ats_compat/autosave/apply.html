<!doctype html><html><head><title>Graduate Engineer — ExampleCo</title></head><body><h1>ExampleCo — Graduate Engineer</h1>
<form action="/submit" method="post">
  <label for="fn">First name *</label><input id="fn" required>
  <label for="em">Email *</label><input id="em" type="email" required>
  <button type="submit">Submit application</button>
</form>
<script>
const extra = new URLSearchParams(location.search).get('extra');
document.querySelectorAll('input').forEach((el) => el.addEventListener('change', () => {
  fetch('/autosave/draft', {method: 'POST', body: JSON.stringify({field: el.id})});
  if (extra === 'analytics') fetch('/analytics/track', {method: 'POST', body: '{}'});
}));
</script></body></html>
