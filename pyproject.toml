[project]
name = "personal-uk-grad-job-intelligence"
version = "0.1.0"
description = "Personal UK international graduate job intelligence platform MVP foundation."
requires-python = ">=3.12"
dependencies = [
    # reportlab: deterministic, real PDF pagination of generated CVs
    # (matching.cv_render). See docs/CV_GENERATION.md.
    "reportlab>=4.0",
    # PyYAML: loads the versioned CV tailoring policy
    # (data/policies/cv_tailoring_skill_v1.yaml, matching.tailoring_skill).
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pypdf>=4"]  # pypdf: tests read back rendered CV PDFs

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

